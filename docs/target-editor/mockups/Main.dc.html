<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Odds panel with add button</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#bfc7d5}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 900px; height: 520px; box-sizing: border-box; background: radial-gradient(circle at 30% 40%, #7a2614 0%, #4a160c 55%, #2a0b06 100%); font-family: 'Jersey 10', monospace; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 40px">
<div style="display: flex; flex-direction: column; gap: 6px; background: #c2452b; padding: 6px; border-radius: 12px; box-shadow: 0 6px 0 rgba(0,0,0,0.3)">
<div style="display: flex; flex-direction: column; gap: 8px; background: #5b2418; padding: 10px 12px 12px; border-radius: 9px">
<div style="display: flex; align-items: center; gap: 10px; height: 30px">
<span style="font-size: 27px; letter-spacing: 0.5px; text-shadow: 0 2px 0 rgba(0,0,0,0.45)">CALCULATRO</span>
<button type="button" aria-label="Add a target" style="font-family: inherit; font-size: 24px; line-height: 1; color: #ffffff; background: #009dff; border: 0; border-radius: 6px; width: 30px; height: 26px; padding: 0; box-shadow: 0 3px 0 #0068a8; text-shadow: 0 2px 0 rgba(0,0,0,0.35); cursor: pointer">+</button>
<span style="flex-grow: 1"></span>
<span style="font-size: 19px; color: #bfc7d5; text-shadow: 0 2px 0 rgba(0,0,0,0.45)">Calculating...</span>
</div>
<div style="display: flex; gap: 18px; background: #1d2628; border-radius: 9px; padding: 8px 12px 10px; box-shadow: 0 4px 0 #120d0c; font-size: 21px; text-shadow: 0 2px 0 rgba(0,0,0,0.6)">
<div style="display: grid; grid-template-columns: 116px 60px 36px 64px; row-gap: 2px; align-items: center">
<span style="color: #bfc7d5">Hands</span><span style="color: #bfc7d5; text-align: right">Keep</span><span></span><span style="color: #bfc7d5; text-align: right">Discard</span>
<span>Any target</span><span style="text-align: right">100%</span><svg width="18" height="16" viewBox="0 0 9 8" shape-rendering="crispEdges" style="justify-self: center; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6))" aria-hidden="true"><rect x="0" y="3" width="5" height="2" fill="#bfc7d5"></rect><rect x="5" y="0" width="1" height="8" fill="#bfc7d5"></rect><rect x="6" y="1" width="1" height="6" fill="#bfc7d5"></rect><rect x="7" y="2" width="1" height="4" fill="#bfc7d5"></rect><rect x="8" y="3" width="1" height="2" fill="#bfc7d5"></rect></svg><span style="text-align: right; color: #fe5f55">88.3%</span>
<span>Pair</span><span style="text-align: right">100%</span><svg width="18" height="16" viewBox="0 0 9 8" shape-rendering="crispEdges" style="justify-self: center; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6))" aria-hidden="true"><rect x="0" y="3" width="5" height="2" fill="#bfc7d5"></rect><rect x="5" y="0" width="1" height="8" fill="#bfc7d5"></rect><rect x="6" y="1" width="1" height="6" fill="#bfc7d5"></rect><rect x="7" y="2" width="1" height="4" fill="#bfc7d5"></rect><rect x="8" y="3" width="1" height="2" fill="#bfc7d5"></rect></svg><span style="text-align: right; color: #fe5f55">88.3%</span>
<span>Trips</span><span style="text-align: right">0%</span><svg width="18" height="16" viewBox="0 0 9 8" shape-rendering="crispEdges" style="justify-self: center; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6))" aria-hidden="true"><rect x="0" y="3" width="5" height="2" fill="#bfc7d5"></rect><rect x="5" y="0" width="1" height="8" fill="#bfc7d5"></rect><rect x="6" y="1" width="1" height="6" fill="#bfc7d5"></rect><rect x="7" y="2" width="1" height="4" fill="#bfc7d5"></rect><rect x="8" y="3" width="1" height="2" fill="#bfc7d5"></rect></svg><span style="text-align: right; color: #4bc292">10.9%</span>
</div>
<div style="display: grid; grid-template-columns: 212px 64px; row-gap: 2px; align-items: center">
<span style="color: #bfc7d5">Drawn cards</span><span style="color: #bfc7d5; text-align: right">Discard</span>
<span>K<span style="display: inline-block; background: #ffffff; color: #1d2628; border-radius: 3px; font-size: 14px; line-height: 15px; padding: 0 2px; margin: 0 2px; text-shadow: none">&#9824;</span>: 1+</span><span style="text-align: right">11.4%</span>
<span>Q<span style="display: inline-block; background: #ffffff; color: #e0393e; border-radius: 3px; font-size: 14px; line-height: 15px; padding: 0 2px; margin: 0 2px; text-shadow: none">&#9829;</span>: 1+</span><span style="text-align: right">11.4%</span>
<span>Mult card: 1+</span><span style="text-align: right">0%</span>
<span>Face card: none</span><span style="text-align: right">42.0%</span>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":520}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
