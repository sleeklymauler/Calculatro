# Lint and tests on every pull request, and on pushes to main that change more
# than docs. The tests run on the Python releases bundle, which is also the
# oldest pyproject.toml supports. The performance tests' timings aren't checked (shared
# runners' are too noisy), but their exact results are, for all but the slowest
# scenarios (tests/perf/test_expected.py). The mod's Lua tests run under LuaJIT,
# the game's Lua, as well as lupa's default Lua.
name: CI

on:
  # Not filtered by path: the ruleset requires these checks, and a pull request
  # whose checks never run can't be merged.
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"

concurrency:  # a newer push to the same branch or PR cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"  # for the ruff version pyproject.toml allows
      - run: ruff check --output-format=github .

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
