name = "calculatro.observe"

[[patches]]
[patches.module]
source = "hint.lua"
before = "main.lua"
name = "calculatro.hint"

# Export game state and update the odds panel once per frame (the module throttles itself).
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "function Game:update(dt)"
position = "after"
payload = "require('calculatro').update(dt)"
match_indent = true

# Hotkey to show/hide the odds panel.
[[patches]]
[patches.pattern]
target = "engine/controller.lua"
pattern = "function Controller:key_press_update(key, dt)"
position = "after"
payload = "require('calculatro').key_press(key)"
match_indent = true
